name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check content rules
        run: npm test

      - name: Build site
        run: npm run build

      - name: Retain comment assets for open articles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! runs=$(gh run list --workflow deploy.yml --branch main --status success --limit 2 --json databaseId --jq '.[].databaseId'); then
            echo "::warning::Pages build history unavailable; checking the published fallback."
            runs=""
          fi
          previous=()
          for run in $runs; do
            if ! available=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts" --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .id'); then continue; fi
            if [[ -z "$available" ]]; then continue; fi
            dir="$RUNNER_TEMP/comment-build-$run"
            if ! gh run download "$run" --name github-pages --dir "$dir"; then continue; fi
            tar -xf "$dir/artifact.tar" -C "$dir" ./_astro ./cs/posts
            if tar -tf "$dir/artifact.tar" | grep -Fx './comment-assets.json' >/dev/null; then
              tar -xf "$dir/artifact.tar" -C "$dir" ./comment-assets.json
            fi
            previous+=("$dir")
          done
          node scripts/retain-comment-assets.mjs dist "${previous[@]}"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
